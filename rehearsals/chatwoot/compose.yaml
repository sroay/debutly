# Chatwoot as its own docker-compose.production.yaml runs it, pinned to one release, with Mailpit
# catching its email so agents can confirm their sign-ups. start.sh writes app.env.
name: rehearse-chatwoot

x-chatwoot: &chatwoot
  image: chatwoot/chatwoot:v4.19.0
  env_file: app.env
  environment:
    - NODE_ENV=production
    - RAILS_ENV=production
    - INSTALLATION_ENV=docker
  depends_on:
    - postgres
    - redis

services:
  rails:
    <<: *chatwoot
    ports:
      - "127.0.0.1:3000:3000"
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]

  sidekiq:
    <<: *chatwoot
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

  postgres:
    image: pgvector/pgvector:pg16
    env_file: app.env

  redis:
    image: redis:7-alpine
    env_file: app.env
    command: ["sh", "-c", 'redis-server --requirepass "$$REDIS_PASSWORD"']

  mailpit:
    image: axllent/mailpit:v1.31.4
    environment:
      # Set by serve.sh when the mailbox gets a public address; empty means no login locally.
      MP_UI_AUTH: ${MAILPIT_AUTH:-}
    ports:
      - "127.0.0.1:8025:8025"
