name: rehearse
# Rehearses a well-known open-source app, started from its own release images on the runner, so
# Debutly's findings can be checked by hand and reported to its maintainers. Started by hand only.
# The report is sealed (rehearsals/seal.sh): run artifacts in a public repo are public, and
# findings on someone else's app wait for a person to check them.
on:
  workflow_dispatch:
    inputs:
      app:
        description: The app to rehearse (a folder in rehearsals/)
        type: choice
        options: [chatwoot, twenty, caldiy]
        default: chatwoot
      languages:
        description: Customers' first languages (empty for the app's debutly.json)
        default: ""
      agents:
        description: How many agents or crews (empty for the app's debutly.json)
        default: ""
      check-only:
        description: Start the app and check sign-up email works, without agents or model calls
        type: boolean
        default: false
      serve-minutes:
        description: Keep the app online for a person to check by hand, for this many minutes (up to 90; no agents)
        default: "0"

permissions:
  contents: read

concurrency: rehearse

jobs:
  rehearse:
    runs-on: ubuntu-latest
    # Cal.diy is built from source first, which takes about half an hour.
    timeout-minutes: 120
    env:
      APP_DIR: rehearsals/${{ inputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The app's own address becomes a temporary https one, with another for its test mailbox.
      - name: Open temporary addresses
        if: ${{ inputs.serve-minutes != '0' }}
        run: bash rehearsals/serve.sh

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.serve-minutes != '0' }}
        with:
          name: sealed-addresses
          path: ${{ runner.temp }}/addresses
          retention-days: 1

      - name: Start ${{ inputs.app }}
        run: bash "$APP_DIR/start.sh"

      - name: Check the app before any model calls
        run: bash "$APP_DIR/check.sh"

      - name: Install Debutly
        if: ${{ !inputs.check-only && inputs.serve-minutes == '0' }}
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run the agents
        if: ${{ !inputs.check-only && inputs.serve-minutes == '0' }}
        working-directory: ${{ env.APP_DIR }}
        env:
          DEBUTLY_API_KEY: ${{ secrets.DEBUTLY_API_KEY }}
          LANGUAGES: ${{ inputs.languages }}
          AGENTS: ${{ inputs.agents }}
        run: |
          if [ -z "$DEBUTLY_API_KEY" ]; then echo "::error title=Rehearsal::Add the DEBUTLY_API_KEY secret to run agents."; exit 1; fi
          args=(--out "$RUNNER_TEMP/report" --trigger manual --ci-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          if [ -n "$LANGUAGES" ]; then args+=(--languages "$LANGUAGES"); fi
          if [ -n "$AGENTS" ]; then args+=(--agents "$AGENTS"); fi
          node "$GITHUB_WORKSPACE/bin/debutly.mjs" run "${args[@]}"

      - name: Seal the report
        if: ${{ always() && !inputs.check-only && inputs.serve-minutes == '0' }}
        run: |
          if [ ! -d "$RUNNER_TEMP/report" ]; then echo "No report was written."; exit 0; fi
          bash rehearsals/seal.sh "$RUNNER_TEMP/report" "$RUNNER_TEMP/sealed"

      - uses: actions/upload-artifact@v4
        if: ${{ always() && !inputs.check-only && inputs.serve-minutes == '0' }}
        with:
          name: sealed-report-${{ inputs.app }}
          path: ${{ runner.temp }}/sealed
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep the app online
        if: ${{ inputs.serve-minutes != '0' }}
        env:
          MINUTES: ${{ inputs.serve-minutes }}
        run: |
          minutes=$(( MINUTES > 90 ? 90 : MINUTES ))
          echo "Online for $minutes minutes; cancel the run to stop sooner."
          sleep $(( minutes * 60 ))

      - name: App logs
        if: failure()
        working-directory: ${{ env.APP_DIR }}
        run: docker compose logs --tail 100
