name: rehearse
# Rehearses a well-known open-source app, started from its own release images on the runner, so
# Debutly's findings can be checked by hand and reported to its maintainers. Started by hand only.
# The report is sealed (rehearsals/seal.sh): run artifacts in a public repo are public, and
# findings on someone else's app wait for a person to check them.
on:
  workflow_dispatch:
    inputs:
      app:
        description: The app to rehearse (a folder in rehearsals/)
        type: choice
        options: [chatwoot, twenty, caldiy]
        default: chatwoot
      languages:
        description: Customers' first languages (empty for the app's debutly.json)
        default: ""
      agents:
        description: How many agents or crews (empty for the app's debutly.json)
        default: ""
      check-only:
        description: Start the app and check sign-up email works, without agents or model calls
        type: boolean
        default: false
      serve-minutes:
        description: Keep the app online for a person to check by hand, for this many minutes (up to 90; no agents)
        default: "0"
      same-people:
        description: Run the agents in the app's people.json (the same people as an earlier run), not new ones
        type: boolean
        default: false
      debutly-ref:
        description: Run another version of Debutly (a branch, tag or commit), to compare it with this one on the same people
        default: ""
      probe:
        description: Instead of agents, run a probe script from the app's folder (e.g. keyboard-probe.mjs) to check a suspected finding
        default: ""

permissions:
  contents: read

# One run per app and Debutly version at a time; two versions of one app can run side by side.
concurrency: rehearse-${{ inputs.app }}-${{ inputs.debutly-ref }}

jobs:
  rehearse:
    runs-on: ubuntu-latest
    # Cal.diy is built from source first, which takes about half an hour.
    timeout-minutes: 120
    env:
      APP_DIR: rehearsals/${{ inputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The app's own address becomes a temporary https one, with another for its test mailbox.
      - name: Open temporary addresses
        if: ${{ inputs.serve-minutes != '0' }}
        run: bash rehearsals/serve.sh

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.serve-minutes != '0' }}
        with:
          name: sealed-addresses
          path: ${{ runner.temp }}/addresses
          retention-days: 1

      - name: Start ${{ inputs.app }}
        run: bash "$APP_DIR/start.sh"

      - name: Check the app before any model calls
        run: bash "$APP_DIR/check.sh"

      - name: Fetch the other Debutly version
        if: ${{ !inputs.check-only && inputs.serve-minutes == '0' && inputs.probe == '' && inputs.debutly-ref != '' }}
        env:
          REF: ${{ inputs.debutly-ref }}
        run: |
          git fetch --no-tags origin "$REF"
          git worktree add "$RUNNER_TEMP/debutly" FETCH_HEAD
          echo "DEBUTLY_DIR=$RUNNER_TEMP/debutly" >> "$GITHUB_ENV"

      - name: Install Debutly
        if: ${{ !inputs.check-only && inputs.serve-minutes == '0' }}
        run: |
          cd "${DEBUTLY_DIR:-$GITHUB_WORKSPACE}"
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Probe ${{ inputs.app }}
        if: ${{ !inputs.check-only && inputs.serve-minutes == '0' && inputs.probe != '' }}
        env:
          PROBE: ${{ inputs.probe }}
        run: |
          case "$PROBE" in */*|.*) echo "::error title=Rehearsal::Name a probe file in $APP_DIR, e.g. keyboard-probe.mjs."; exit 1 ;; esac
          if [ ! -f "$APP_DIR/$PROBE" ]; then echo "::error title=Rehearsal::$APP_DIR/$PROBE doesn't exist."; exit 1; fi
          # What it prints is about someone else's app, so it is sealed like a report.
          mkdir -p "$RUNNER_TEMP/report"
          cd "$RUNNER_TEMP/report"
          node "$GITHUB_WORKSPACE/$APP_DIR/$PROBE" > probe.txt 2>&1 || echo "The probe failed; its output says why."

      - name: Run the agents
        if: ${{ !inputs.check-only && inputs.serve-minutes == '0' && inputs.probe == '' }}
        working-directory: ${{ env.APP_DIR }}
        env:
          DEBUTLY_API_KEY: ${{ secrets.DEBUTLY_API_KEY }}
          LANGUAGES: ${{ inputs.languages }}
          AGENTS: ${{ inputs.agents }}
          SAME_PEOPLE: ${{ inputs.same-people }}
        run: |
          if [ -z "$DEBUTLY_API_KEY" ]; then echo "::error title=Rehearsal::Add the DEBUTLY_API_KEY secret to run agents."; exit 1; fi
          args=(--out "$RUNNER_TEMP/report" --trigger manual --ci-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          if [ -n "$LANGUAGES" ]; then args+=(--languages "$LANGUAGES"); fi
          if [ -n "$AGENTS" ]; then args+=(--agents "$AGENTS"); fi
          if [ "$SAME_PEOPLE" = "true" ]; then
            if [ ! -f people.json ]; then echo "::error title=Rehearsal::$APP_DIR/people.json is missing: commit the people.json of an earlier run."; exit 1; fi
            args+=(--people people.json)
          fi
          node "${DEBUTLY_DIR:-$GITHUB_WORKSPACE}/bin/debutly.mjs" run "${args[@]}"

      - name: Seal the report
        if: ${{ always() && !inputs.check-only && inputs.serve-minutes == '0' }}
        run: |
          if [ ! -d "$RUNNER_TEMP/report" ]; then echo "No report was written."; exit 0; fi
          bash rehearsals/seal.sh "$RUNNER_TEMP/report" "$RUNNER_TEMP/sealed"

      - uses: actions/upload-artifact@v4
        if: ${{ always() && !inputs.check-only && inputs.serve-minutes == '0' }}
        with:
          name: sealed-report-${{ inputs.app }}
          path: ${{ runner.temp }}/sealed
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep the app online
        if: ${{ inputs.serve-minutes != '0' }}
        env:
          MINUTES: ${{ inputs.serve-minutes }}
        run: |
          minutes=$(( MINUTES > 90 ? 90 : MINUTES ))
          echo "Online for $minutes minutes; cancel the run to stop sooner."
          sleep $(( minutes * 60 ))

      - name: App logs
        if: failure()
        working-directory: ${{ env.APP_DIR }}
        run: docker compose logs --tail 100
